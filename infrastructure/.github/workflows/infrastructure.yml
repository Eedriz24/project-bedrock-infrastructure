name: Terraform CI/CD

# Pull Request -> terraform plan, posted as a PR comment for review.
# Merge to main -> terraform apply. This makes REAL changes to live
# infrastructure. The `environment: production` gate on the apply job
# lets you optionally require a manual approval in GitHub's Environments
# settings before it runs, on top of PR review.

on:
  pull_request:
    paths:
      - "infrastructure/terraform/**"
  push:
    branches: [main]
    paths:
      - "infrastructure/terraform/**"

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  # ==========================================================
  # PLAN - runs only on pull_request events
  # ==========================================================
  plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infrastructure/terraform
    steps:
      - uses: actions/checkout@v4

      # --- Credentials: OIDC preferred ---
      # Set the AWS_OIDC_ROLE_ARN repo secret (from bootstrap/ output
      # `deploy_role_arn`) to use this path. No long-lived keys involved.
      - name: Configure AWS credentials (OIDC)
        if: ${{ vars.AWS_AUTH_METHOD != 'access_keys' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: us-east-1

      # --- Credentials: Access Key fallback ---
      # Only used if the repository variable AWS_AUTH_METHOD is set to
      # "access_keys" (e.g. OIDC federation isn't set up yet). Requires
      # the AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY repo secrets.
      - name: Configure AWS credentials (Access Key fallback)
        if: ${{ vars.AWS_AUTH_METHOD == 'access_keys' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.11.4"

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate -no-color

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan -no-color -input=false -out=tfplan 2>&1 | tee plan_output.txt
          echo "exitcode=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
        continue-on-error: true

      - name: Truncate plan for PR comment
        run: |
          # GitHub comment bodies cap at 65536 chars; keep well under that.
          if [ "$(wc -c < plan_output.txt)" -gt 60000 ]; then
            echo "... (truncated, see full log in the Actions run) ..." > plan_truncated.txt
            tail -c 55000 plan_output.txt >> plan_truncated.txt
          else
            cp plan_output.txt plan_truncated.txt
          fi

      # Sticky comment: updates the same comment on every push to the PR
      # instead of spamming a new one each time.
      - name: Post plan as PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('infrastructure/terraform/plan_truncated.txt', 'utf8');
            const outcome = "${{ steps.plan.outputs.exitcode }}" === "0" ? "Success" : "Failed";
            const body = [
              `### Terraform Plan - ${outcome}`,
              "",
              "```diff",
              plan,
              "```",
              "",
              "Review carefully before merging - terraform apply runs automatically on merge to main and makes real changes to live infrastructure."
            ].join("\n");

            const marker = "<!-- terraform-plan-comment -->";
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes(marker));
            const fullBody = `${marker}\n${body}`;

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: fullBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: fullBody,
              });
            }

      - name: Fail job if plan failed
        if: steps.plan.outputs.exitcode != '0'
        run: exit 1

  # ==========================================================
  # APPLY - runs only on push to main
  # ==========================================================
  apply:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production   # optional manual-approval gate; safe to remove
    permissions:
      id-token: write
      contents: write   # needs write (not just read) to commit grading.json back
    defaults:
      run:
        working-directory: infrastructure/terraform
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        if: ${{ vars.AWS_AUTH_METHOD != 'access_keys' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: us-east-1

      - name: Configure AWS credentials (Access Key fallback)
        if: ${{ vars.AWS_AUTH_METHOD == 'access_keys' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.11.4"

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply
        run: terraform apply -auto-approve -input=false

      # Regenerate grading.json from the (non-sensitive-only) root
      # outputs after every successful apply, so it never drifts from
      # the live infrastructure.
      - name: Update grading.json
        run: terraform output -json > ../../grading.json

      - name: Commit updated grading.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ../../grading.json
          git diff --cached --quiet || git commit -m "chore: update grading.json [skip ci]"
          git push