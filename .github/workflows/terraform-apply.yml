name: Terraform Apply

# Merge to main -> terraform apply. This makes REAL changes to live
# infrastructure. The `environment: production` gate below lets you
# optionally require a manual approval in GitHub's Environments settings
# before this job runs, on top of PR review.

on:
  push:
    branches: [main]
    paths:
      - "infrastructure/terraform/**"

permissions:
  id-token: write
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    environment: production   # optional manual-approval gate; safe to remove
    defaults:
      run:
        working-directory: infrastructure/terraform
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        if: ${{ vars.AWS_AUTH_METHOD != 'access_keys' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: us-east-1

      - name: Configure AWS credentials (Access Key fallback)
        if: ${{ vars.AWS_AUTH_METHOD == 'access_keys' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.11.4"

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply
        run: terraform apply -auto-approve -input=false

      # Regenerate grading.json from the (non-sensitive-only) root
      # outputs after every successful apply, so it never drifts from
      # the live infrastructure.
      - name: Update grading.json
        run: terraform output -json > ../../grading.json

      - name: Commit updated grading.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add grading.json
          git diff --cached --quiet || git commit -m "chore: update grading.json [skip ci]"
          git push
